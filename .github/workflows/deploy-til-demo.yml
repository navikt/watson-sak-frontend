name: Deploy til demo-miljø
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy til demo-miljø
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Bygg og push docker image til GAR
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # main
        id: docker-push-demo
        with:
          team: holmes
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          build_secrets: NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
      - name: Deploy til nais
        uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        env:
          CLUSTER: dev-gcp
          IMAGE: ${{ steps.docker-push-demo.outputs.image }}
          RESOURCE: .nais/demo.yml
          VAR: APP_VERSION=${{ github.sha }}
