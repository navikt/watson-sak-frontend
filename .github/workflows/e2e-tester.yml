name: Ende-til-ende-tester

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Kjør ende-til-ende-tester
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Sett opp Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@navikt"

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Kjør E2E-tester
        run: pnpm run test:e2e
        env:
          CLUSTER: dev-gcp
          FARO_URL: https://telemetry.ekstern.dev.nav.no/collect
          UMAMI_SITE_ID: dummy-site-id
          IDENT_SESSION_SECRET: dummy-secret
          ENVIRONMENT: local-mock
          MODIA_URL: https://modiapersonoversikt.intern.dev.nav.no
          UNLEASH_SERVER_API_URL: dummy
          UNLEASH_SERVER_API_TOKEN: dummy
          UNLEASH_SERVER_API_PROJECTS: default
          UNLEASH_SERVER_API_TYPE: CLIENT
          UNLEASH_SERVER_API_ENV: development
          APP_VERSION: ${{ github.sha }}

      - name: Last opp test rapport
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
