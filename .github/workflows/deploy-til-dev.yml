name: Deploy til dev-miljø
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy til dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bygg og push docker image til GAR
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # main
        id: docker-push-dev
        with:
          team: holmes
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          build_secrets: NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
      - name: Deploy til nais
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-gcp
          IMAGE: ${{ steps.docker-push-dev.outputs.image }}
          VAR: APP_VERSION=${{ github.sha }}
          RESOURCE: .nais/nais.yml
          VARS: .nais/dev.json
